[project]
name = "qci-infra"
version = "0.1.0"
description = "Monitor QCI cloud servers, track cost, and email alerts."
requires-python = ">=3.12"
dependencies = ["httpx>=0.27"]

[project.scripts]
qci-infra = "qci_infra.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8"]
