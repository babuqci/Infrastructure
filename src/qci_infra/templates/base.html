<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>QCI Infra</title>
<style>
:root{--bg:#f7f7f5;--fg:#1d1d1b;--muted:#6b6b66;--card:#fff;--line:#e3e2dc;--accent:#2f5d8a;--bad:#b3261e;--ok:#2e7d32;--warn:#a15c00}
@media (prefers-color-scheme:dark){:root{--bg:#161615;--fg:#ecebe6;--muted:#9c9b94;--card:#1f1f1d;--line:#33322f;--accent:#7fa8d1;--bad:#f2867e;--ok:#7cc480;--warn:#e0a54f}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 -apple-system,system-ui,"Segoe UI",sans-serif}
header{display:flex;gap:18px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--card)}
header b{margin-right:8px}header a{color:var(--fg);text-decoration:none}header a.on{color:var(--accent);font-weight:600}
header .me{margin-left:auto;color:var(--muted)}main{max-width:1200px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 16px}h2{font-size:15px;margin:24px 0 8px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px}.tile .n{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.tile .l{color:var(--muted);font-size:12px}.wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;background:var(--card);border:1px solid var(--line);border-radius:8px}
th,td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--muted);font-weight:500;font-size:12px}
td.num{text-align:right;font-variant-numeric:tabular-nums}.bad{color:var(--bad)}.ok{color:var(--ok)}.warn{color:var(--warn)}.muted{color:var(--muted)}
.bars{display:flex;align-items:flex-end;gap:2px;height:160px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px}
.bars div{flex:1;background:var(--accent);min-height:1px;border-radius:2px 2px 0 0}
a.btn{display:inline-block;padding:8px 14px;border-radius:6px;background:var(--accent);color:var(--bg);text-decoration:none}
</style></head><body>
{% if user %}<header><b>QCI Infra</b>
{% set p = request.url.path %}
<a href="/" class="{{ 'on' if p == '/' }}">Overview</a><a href="/vms" class="{{ 'on' if p == '/vms' }}">VMs</a>
<a href="/alerts" class="{{ 'on' if p == '/alerts' }}">Alerts</a><a href="/cost" class="{{ 'on' if p == '/cost' }}">Cost</a>
<a href="/sql" class="{{ 'on' if p == '/sql' }}">SQL Server</a><a href="/certs" class="{{ 'on' if p == '/certs' }}">Certificates</a>
<span class="me">{{ user.email }} · <a href="/logout">Sign out</a></span></header>{% endif %}
<main>{% block body %}{% endblock %}</main></body></html>
